name: CD

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment destination'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - railway
          - docker-ghcr

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm run build

  deploy-railway:
    name: Deploy to Railway
    needs: validate
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' || github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'railway')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Railway Secret Availability
        id: check-secret
        run: |
          if [ -n "${{ secrets.RAILWAY_TOKEN }}" ] || [ -n "${{ secrets.RAILWAY_DEPLOY_WEBHOOK }}" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "::notice ::Railway deployment skipped because RAILWAY_TOKEN or RAILWAY_DEPLOY_WEBHOOK is not configured in GitHub Secrets."
          fi

      - name: Trigger Railway Deploy Webhook
        if: steps.check-secret.outputs.has_secret == 'true' && secrets.RAILWAY_DEPLOY_WEBHOOK != ''
        run: |
          echo "Triggering Railway deployment via webhook..."
          curl -f -X POST "${{ secrets.RAILWAY_DEPLOY_WEBHOOK }}"

      - name: Deploy via Railway CLI
        if: steps.check-secret.outputs.has_secret == 'true' && secrets.RAILWAY_TOKEN != '' && secrets.RAILWAY_DEPLOY_WEBHOOK == ''
        run: |
          npm install -g @railway/cli
          railway up --detach --service "${{ secrets.RAILWAY_SERVICE_NAME || '' }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  publish-docker-ghcr:
    name: Build & Push Docker Image (GHCR)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: |
      (github.event_name == 'push' || github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'docker-ghcr')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
